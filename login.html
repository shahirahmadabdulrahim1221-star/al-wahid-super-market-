<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Al Wahid Hyper Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/loader.css" />
</head>
<body>

  <div class="auth-page">
    <!-- LEFT: 3D scene -->
    <div class="auth-visual">
      <canvas id="loginCanvas"></canvas>
      <div class="auth-visual-content">
        <div class="brand" style="color:white;">
          <div class="brand-logo" style="background:rgba(255,255,255,.2);">AW</div>
          <div class="brand-text"><strong>Al Wahid</strong><span style="color:rgba(255,255,255,.7);">Hyper Market</span></div>
        </div>
        <div>
          <h2 data-reveal>Welcome back to your digital supermarket.</h2>
          <p>Sign in to access your orders, wishlist, loyalty points, and personalized recommendations.</p>
        </div>
        <div style="font-size:12px;color:rgba(255,255,255,.6);">© 2026 Al Wahid Hyper Market</div>
      </div>
    </div>

    <!-- RIGHT: Form -->
    <div class="auth-form-side">
      <div class="auth-form-wrap">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:24px;"><i class="fa-solid fa-arrow-left"></i> Back to store</a>

        <h1 data-reveal>Sign in</h1>
        <p>Enter your credentials to continue.</p>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign In</button>
          <button class="auth-tab" data-tab="signup">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" data-form="login">
          <div class="auth-input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </div>
          <div class="auth-input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPass" placeholder="••••••••" required />
            <button type="button" class="auth-toggle-pass"><i class="fa-solid fa-eye"></i></button>
          </div>
          <label class="auth-checkbox"><input type="checkbox" /> Remember me for 30 days</label>
          <button type="submit" class="btn btn-primary btn-full">Sign In <i class="fa-solid fa-arrow-right"></i></button>

          <div class="auth-divider">or continue with</div>
          <div class="social-login">
            <button type="button"><i class="fa-brands fa-google"></i> Google</button>
            <button type="button"><i class="fa-brands fa-apple"></i> Apple</button>
          </div>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" data-form="signup" style="display:none;">
          <div class="auth-input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="signupName" placeholder="Full name" required />
          </div>
          <div class="auth-input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="signupEmail" placeholder="you@example.com" required />
          </div>
          <div class="auth-input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signupPass" placeholder="Create password" required />
            <button type="button" class="auth-toggle-pass"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="auth-input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="signupConfirm" placeholder="Confirm password" required />
            <button type="button" class="auth-toggle-pass"><i class="fa-solid fa-eye"></i></button>
          </div>
          <label class="auth-checkbox"><input type="checkbox" required /> I agree to the Terms &amp; Privacy Policy</label>
          <button type="submit" class="btn btn-primary btn-full">Create Account <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/cursor.js"></script>
  <script src="assets/js/three-scene.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product.js"></script>
  <script>
    Loader.init();
    Loader.attachLinks();
    Cursor.init();
    Auth.init();
    document.addEventListener('DOMContentLoaded', () => {
      Scene3D.createSupermarketScene('loginCanvas', { mode: 'login' });
      // theme
      const saved = localStorage.getItem('aw_theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    });
  </script>
</body>
</html>
